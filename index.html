<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upper Rancho Elementary School | Pangantucan, Bukidnon</title>
  <style>
    :root {
      --green-dark: #022c22;
      --green-main: #065f46;
      --green-mid: #047857;
      --green-light: #ecfdf5;
      --amber: #f59e0b;
      --blue: #1877f2;
      --blue-hover: #145dbf;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-200: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--slate-900);
      line-height: 1.6;
    }
    a { text-decoration: none; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 18px; }

    /* Top Bar */
    .top-bar {
      background: var(--green-dark);
      color: #d1fae5;
      font-size: 12px;
      padding: 8px 0;
    }
    .top-bar .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
    }
    .top-bar strong { color: #fcd34d; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid var(--slate-200);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      max-width: 1100px;
      margin: 0 auto;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--slate-900); }
    .logo-badge {
      width: 42px; height: 42px;
      background: var(--green-main);
      color: #fff;
      font-weight: 800;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 16px; line-height: 1.2; }
    .brand p { font-size: 12px; color: var(--slate-600); }
    nav { display: flex; gap: 18px; font-size: 14px; font-weight: 500; }
    nav a { color: var(--slate-700); }
    nav a:hover { color: var(--green-main); }

    /* Buttons */
    .btn-fb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-fb:hover { background: var(--blue-hover); }
    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.3);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
    }
    .btn-outline:hover { background: rgba(255,255,255,0.22); }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, #022c22 0%, #065f46 60%, #115e59 100%);
      color: #ffffff;
      padding: 60px 0;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 32px;
      align-items: center;
    }
    .pill {
      display: inline-block;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.25);
      color: #d1fae5;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .hero h2 { font-size: 36px; line-height: 1.2; margin-bottom: 16px; }
    .hero p { color: #d1fae5; font-size: 16px; margin-bottom: 24px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }

    /* SRC Stats Box */
    .src-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      padding: 24px;
    }
    .src-box h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fcd34d;
      margin-bottom: 16px;
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card {
      background: rgba(2, 44, 34, 0.55);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px;
    }
    .stat-num { font-size: 26px; font-weight: 800; color: #ffffff; }
    .stat-num.gold { color: #fcd34d; }
    .stat-label { font-size: 12px; color: #d1fae5; margin-top: 2px; }
    .src-note { font-size: 12px; color: #d1fae5; margin-top: 14px; }

    /* Sections */
    section { padding: 60px 0; }
    .eyebrow {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--green-mid);
      margin-bottom: 6px;
    }
    .section-title { font-size: 28px; font-weight: 800; color: var(--slate-900); margin-bottom: 14px; }
    .section-sub { color: var(--slate-600); max-width: 650px; margin-bottom: 32px; }

    /* About */
    .about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: start; }
    .about-text p { color: var(--slate-700); margin-bottom: 14px; }
    .card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .glance-list { list-style: none; margin-top: 12px; }
    .glance-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      gap: 10px;
    }
    .glance-list li:last-child { border-bottom: none; }

    /* VMV */
    .vmv-section { background: var(--green-light); border-top: 1px solid #d1fae5; border-bottom: 1px solid #d1fae5; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .card h4 { color: var(--green-main); font-size: 18px; margin-bottom: 10px; }
    .card ul { padding-left: 18px; color: var(--slate-700); font-size: 14px; }
    .card ul li { margin-bottom: 6px; }
    .core-card { text-align: center; padding: 18px; }
    .core-card strong { display: block; color: var(--green-main); font-size: 16px; margin-bottom: 4px; }
    .core-card span { font-size: 12px; color: var(--slate-600); }

    /* Faculty */
    .principal-card {
      max-width: 420px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, #065f46, #022c22);
      color: #ffffff;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(6,95,70,0.2);
    }
    .avatar-gold {
      width: 64px; height: 64px;
      background: #fbbf24;
      color: #022c22;
      font-weight: 800;
      font-size: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .principal-role {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: #fde68a;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .teacher-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
    }
    .teacher-num {
      width: 42px; height: 42px;
      background: #d1fae5;
      color: var(--green-main);
      font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .teacher-card h5 { font-size: 15px; color: var(--slate-900); }
    .teacher-card p { font-size: 12px; color: var(--slate-600); }

    /* ESIP Dark Section */
    .dark-section { background: var(--slate-900); color: #ffffff; }
    .dark-section .eyebrow { color: #fbbf24; }
    .dark-section .section-title { color: #ffffff; }
    .dark-section .section-sub { color: #cbd5e1; }
    .dark-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 22px;
    }
    .dark-card span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #34d399; }
    .dark-card h4 { font-size: 18px; margin: 6px 0 8px; color: #ffffff; }
    .dark-card p { font-size: 14px; color: #cbd5e1; }

    /* Updates */
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: #d1fae5;
      color: var(--green-main);
      margin-bottom: 10px;
    }
    .tag.amber { background: #fef3c7; color: #92400e; }
    .tag.blue { background: #dbeafe; color: #1e40af; }

    /* Contact CTA */
    .cta-box {
      background: linear-gradient(135deg, #065f46, #0f766e);
      color: #ffffff;
      border-radius: 22px;
      padding: 40px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .cta-box h3 { font-size: 26px; margin: 6px 0 10px; }
    .cta-box p { color: #d1fae5; max-width: 580px; font-size: 15px; }

    /* Footer */
    footer {
      background: #020617;
      color: #94a3b8;
      font-size: 12px;
      padding: 28px 0;
    }
    .footer-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    footer a { color: #60a5fa; font-weight: 600; }

    /* Mobile Responsive */
    @media (max-width: 820px) {
      nav { display: none; }
      .hero-grid, .about-grid, .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: 1fr 1fr; }
      .hero h2 { font-size: 28px; }
    }
  </style>
</head>
<body>
